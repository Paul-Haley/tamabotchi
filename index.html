<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamabotchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a10; --panel:#12121a; --panel2:#191922; --line:#26262f;
    --text:#e9e9f2; --muted:#7d7d92;
    --green:#3ddc84; --amber:#ffb648; --red:#ff5c5c; --purple:#b98bff; --blue:#5ec8ff;
    --cream:#f4dfb8;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    display:flex; flex-direction:column; overflow:hidden; height:100vh;
  }
  .pixel{font-family:'Press Start 2P',monospace;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- header ---------- */
  header{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header h1{font-size:16px; margin:0; letter-spacing:1px;}
  .meta{color:var(--muted); font-size:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .meta b{color:var(--text); font-weight:600;}
  .spacer{flex:1;}
  .pill{
    padding:4px 10px; border-radius:999px; font-size:11px; font-weight:600;
    border:1px solid var(--line); background:var(--panel2);
  }
  .pill.plugged{background:rgba(255,92,92,.15); border-color:var(--red); color:var(--red); animation:pulseSoft 1.4s infinite;}
  button{
    font-family:inherit; font-size:12px; font-weight:600; color:var(--text);
    background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    padding:8px 12px; cursor:pointer; transition:.15s;
  }
  button:hover{border-color:var(--muted); transform:translateY(-1px);}
  button.danger{color:var(--red); border-color:#3a2020;}
  button.active{color:var(--red); background:rgba(255,92,92,.12); border-color:var(--red);}

  .speed-ctrl{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);}
  .speed-ctrl input[type="range"]{width:90px; accent-color:var(--blue);}
  .speed-ctrl input[type="number"]{
    width:48px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-family:'JetBrains Mono',monospace; font-size:11px; padding:3px 4px;
  }

  /* ---------- main layout ---------- */
  main{flex:1; display:grid; grid-template-columns:35% 1fr; min-height:0;}
  .left{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px; border-right:1px solid var(--line); position:relative;
  }
  .right{display:flex; flex-direction:column; min-height:0; padding:18px 22px;}

  /* ---------- pet ---------- */
  .pet-stage{position:relative; width:260px; height:260px; display:flex; align-items:center; justify-content:center;}
  .glow{
    position:absolute; width:210px; height:210px; border-radius:50%; filter:blur(38px);
    background:var(--muted); opacity:.35; transition:background .6s, opacity .6s;
  }
  [data-state="ok"] .glow{background:var(--green); opacity:.45; animation:glowPulse 2.4s ease-in-out infinite;}
  [data-state="drifting"] .glow{background:var(--amber); opacity:.4; animation:glowPulse 1.4s ease-in-out infinite;}
  [data-state="fatal"] .glow{background:var(--red); opacity:.22;}
  [data-state="thinking"] .glow{background:var(--blue); opacity:.4; animation:glowPulse 1.8s ease-in-out infinite;}
  [data-state="unknown"] .glow{background:var(--muted); opacity:.28;}
  @keyframes glowPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  .pet{position:relative; width:170px; height:150px;}
  [data-state="ok"] .pet{animation:bounce 1.1s ease-in-out infinite;}
  [data-state="drifting"] .pet{animation:wobble 0.7s ease-in-out infinite;}
  [data-state="thinking"] .pet{animation:breathe 2.2s ease-in-out infinite;}
  [data-state="unknown"] .pet{animation:breathe 3s ease-in-out infinite;}
  [data-state="fatal"] .pet{filter:grayscale(1) brightness(.75); animation:none;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-14px);}}
  @keyframes wobble{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}

  .body{
    position:absolute; inset:0; background:var(--cream); border-radius:50% 50% 46% 46%/58% 58% 42% 42%;
    box-shadow:inset 0 -14px 0 rgba(0,0,0,.06), 0 10px 24px rgba(0,0,0,.35);
  }
  .ear{position:absolute; width:34px; height:34px; background:var(--cream); border-radius:50%; top:-10px;}
  .ear-l{left:6px;} .ear-r{right:6px;}

  .eye{position:absolute; width:22px; height:22px; background:#1c1c22; border-radius:50%; top:52px; transition:.25s;}
  .eye-l{left:44px;} .eye-r{right:44px;}
  .brow{position:absolute; width:22px; height:4px; background:#1c1c22; border-radius:4px; top:38px; opacity:0; transition:.25s;}
  .brow-l{left:44px; transform:rotate(14deg);} .brow-r{right:44px; transform:rotate(-14deg);}
  .mouth{position:absolute; left:50%; top:92px; transform:translateX(-50%); background:#1c1c22; transition:.25s;
    width:34px; height:16px; border:4px solid #1c1c22; border-top:none; border-radius:0 0 30px 30px;}
  .sweat{position:absolute; right:30px; top:44px; font-size:16px; opacity:0;}
  .heart{position:absolute; left:50%; top:-6px; transform:translateX(-50%); color:#ff7a92; font-size:18px; opacity:0;}
  .qmark{position:absolute; left:50%; top:-22px; transform:translateX(-50%); font-size:20px; font-weight:800; color:var(--muted); opacity:0;}
  .dots{position:absolute; left:50%; top:-16px; transform:translateX(-50%); font-size:20px; font-weight:800; color:var(--blue); opacity:0; letter-spacing:2px;}
  .xmark{position:absolute; top:50px; width:22px; height:22px; opacity:0;}
  .xmark::before,.xmark::after{content:"";position:absolute; left:2px; top:9px; width:18px; height:4px; background:#1c1c22; border-radius:2px;}
  .xmark::before{transform:rotate(45deg);} .xmark::after{transform:rotate(-45deg);}
  .xmark.l{left:38px;} .xmark.r{right:38px;}

  /* state-specific face swaps */
  [data-state="ok"] .eye{height:6px; top:56px; border-radius:6px 6px 0 0/12px 12px 0 0;}
  [data-state="ok"] .mouth{width:38px; height:20px;}
  [data-state="ok"] .heart{animation:heartPop 3.6s ease-in-out infinite;}
  @keyframes heartPop{0%,70%,100%{opacity:0; transform:translate(-50%,0) scale(.6);}80%{opacity:1; transform:translate(-50%,-10px) scale(1);}90%{opacity:0;}}

  [data-state="drifting"] .brow{opacity:1; top:34px; transform:rotate(-14deg);}
  [data-state="drifting"] .brow-r{transform:rotate(14deg);}
  [data-state="drifting"] .mouth{width:16px; height:16px; border-radius:50%;}
  [data-state="drifting"] .sweat{opacity:1; animation:sweatDrop 1.1s ease-in infinite;}
  @keyframes sweatDrop{0%{opacity:0; transform:translateY(-4px);}30%{opacity:1;}100%{opacity:0; transform:translateY(14px);}}

  [data-state="fatal"] .eye{opacity:0;}
  [data-state="fatal"] .xmark{opacity:1;}
  [data-state="fatal"] .mouth{width:34px; height:4px; border-radius:2px; border:none; background:#1c1c22;}

  [data-state="thinking"] .eye{top:44px;}
  [data-state="thinking"] .mouth{width:12px; height:12px; border-radius:50%;}
  [data-state="thinking"] .dots{opacity:1; animation:dotsFloat 1.6s ease-in-out infinite;}
  @keyframes dotsFloat{0%,100%{opacity:.4; transform:translate(-50%,0);}50%{opacity:1; transform:translate(-50%,-4px);}}

  [data-state="unknown"] .mouth{width:18px; height:4px; border-radius:2px; border:none; background:#1c1c22;}
  [data-state="unknown"] .qmark{opacity:1; animation:qBob 2s ease-in-out infinite;}
  @keyframes qBob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,-6px);}}

  .ecg{position:absolute; bottom:-6px; width:200px; height:34px; opacity:0; transition:opacity .4s;}
  [data-state="fatal"] .ecg{opacity:1;}
  .ecg polyline{fill:none; stroke:var(--red); stroke-width:2;}
  .ecg .scan{stroke:rgba(255,255,255,.5); stroke-width:1.5; stroke-dasharray:6 194; animation:scan 2.6s linear infinite;}
  @keyframes scan{to{stroke-dashoffset:-200;}}

  /* ---------- status / bubble ---------- */
  .status-word{font-size:26px; font-weight:800; letter-spacing:1px; color:var(--muted); transition:color .3s;}
  .status-word.ok{color:var(--green);} .status-word.drifting{color:var(--amber);}
  .status-word.fatal{color:var(--red);}
  .judge-detail{font-size:11px; color:var(--muted); margin-top:-8px; max-width:260px; text-align:center;}
  .bubble{
    background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
    max-width:280px; text-align:center; font-size:14px; position:relative; min-height:20px;
  }
  .bubble::before{content:"";position:absolute; top:-8px; left:50%; transform:translateX(-50%); border:8px solid transparent; border-bottom-color:var(--panel2);}
  .model-line{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .badge-mock{background:var(--purple); color:#1a0f2e; font-weight:800; font-size:10px; padding:2px 6px; border-radius:6px;}

  /* ---------- right column ---------- */
  .goal-line{font-size:14px; color:var(--text); margin-bottom:12px; flex:0 0 auto;}
  .goal-line .muted{color:var(--muted); font-style:italic;}
  .trail-wrap{flex:1; overflow-y:auto; position:relative; padding-left:20px;}
  .trail-wrap::before{content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:linear-gradient(var(--line),var(--line));}
  .decision{
    position:relative; background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--muted);
    border-radius:10px; padding:10px 14px; margin:0 0 12px 6px; cursor:pointer;
    transition:border-color .5s, box-shadow .5s, transform .15s;
  }
  .decision:hover{transform:translateX(2px) translateY(-1px); box-shadow:0 4px 14px rgba(0,0,0,.35);}
  .decision::before{content:""; position:absolute; left:-24px; top:16px; width:10px; height:10px; border-radius:50%; background:var(--muted); border:2px solid var(--bg); transition:background .5s;}
  .decision.toward{border-left-color:var(--green);} .decision.toward::before{background:var(--green);}
  .decision.sideways{border-left-color:var(--amber);} .decision.sideways::before{background:var(--amber);}
  .decision.away{border-left-color:var(--red);} .decision.away::before{background:var(--red);}
  .decision.fatal-pin{box-shadow:0 0 0 1px var(--red), 0 0 18px rgba(255,92,92,.45);}
  .decision-head{display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap;}
  .turn-tag{font-size:10px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .decision-label{font-weight:700; font-size:13px;}
  .decision-why{font-size:12px; color:var(--muted); line-height:1.4;}
  .tag-sub{background:rgba(185,139,255,.18); color:var(--purple); font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px;}
  .tag-fatal{background:rgba(255,92,92,.18); color:var(--red); font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px;}
  .tag-revised{background:rgba(94,200,255,.18); color:var(--blue); font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; animation:fadeTag .4s;}
  @keyframes fadeTag{from{opacity:0;} to{opacity:1;}}
  .decision.enter{animation:slideIn .4s ease;}
  @keyframes slideIn{from{opacity:0; transform:translateX(-14px);} to{opacity:1; transform:translateX(0);}}
  .decision.flash{animation:flashPulse 1s ease;}
  @keyframes flashPulse{0%,100%{box-shadow:none;}30%{box-shadow:0 0 0 3px rgba(94,200,255,.5);}}
  .trail-empty{color:var(--muted); font-size:13px; padding:10px 0;}

  /* ---------- ticker ---------- */
  .ticker{
    flex:0 0 auto; display:flex; gap:8px; align-items:center; padding:9px 18px;
    background:var(--panel); border-top:1px solid var(--line); overflow:hidden; white-space:nowrap;
  }
  .chip{
    font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 9px; border-radius:7px;
    background:var(--panel2); border:1px solid var(--line); color:var(--muted); flex:0 0 auto;
    animation:chipIn .3s ease;
  }
  .chip b{color:var(--text);}
  .chip.err{border-color:var(--red); color:var(--red);}
  .chip.end{border-color:var(--green); color:var(--green);}
  @keyframes chipIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- drawer ---------- */
  .drawer{
    position:fixed; top:0; right:-420px; width:400px; height:100%; background:var(--panel);
    border-left:1px solid var(--line); transition:right .25s ease; z-index:20; display:flex; flex-direction:column;
  }
  .drawer.open{right:0;}
  .drawer-head{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line);}
  .drawer-body{flex:1; overflow:auto; padding:16px;}
  .drawer-body pre{margin:0; font-size:12px; font-family:'JetBrains Mono',monospace; white-space:pre-wrap; color:var(--text);}
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:19; display:none;}
  .overlay.open{display:block;}

  .pv-pill{display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:uppercase;}
  .pv-pill.toward{background:rgba(61,220,132,.18); color:var(--green);}
  .pv-pill.sideways{background:rgba(255,182,72,.18); color:var(--amber);}
  .pv-pill.away{background:rgba(255,92,92,.18); color:var(--red);}
  .pv-why{font-size:13px; color:var(--muted); margin:10px 0 18px; line-height:1.5;}
  .pv-h{font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:16px 0 8px;}
  .pv-evidence{
    font-family:'JetBrains Mono',monospace; font-size:12px; background:rgba(94,200,255,.1);
    border:1px solid rgba(94,200,255,.35); border-radius:8px; padding:10px 12px; color:var(--text); white-space:pre-wrap;
  }
  .pv-tblock{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:8px 10px; margin-bottom:8px; white-space:pre-wrap; word-break:break-word;
  }
  .pv-tblock .h{color:var(--muted); font-weight:700; margin-bottom:4px; display:block;}
  .pv-tblock.own{border-color:var(--blue); box-shadow:0 0 0 1px rgba(94,200,255,.25);}
  .pv-tblock.err .h{color:var(--red);}
  .pv-contradict{border-color:var(--red)!important; box-shadow:0 0 0 1px rgba(255,92,92,.3)!important;}
  .pv-caption{font-size:11px; color:var(--red); font-style:italic; margin-top:4px;}
  .pv-empty{color:var(--muted); font-size:12px; font-style:italic;}
  mark{background:rgba(255,182,72,.55); color:#1a1a1a; padding:0 2px; border-radius:2px;}
</style>
</head>
<body>

<header>
  <h1 class="pixel">TAMABOTCHI</h1>
  <div class="meta">
    <b id="mFile">—</b>
    <span id="mMode">—</span>
    <span id="mRecorded"></span>
  </div>
  <div class="speed-ctrl" id="speedCtrl" style="display:none;">
    <span>speed ×</span>
    <input type="range" id="speedRange" min="1" max="200" value="20">
    <input type="number" id="speedNum" min="1" max="200" value="20">
    <span>gap ms</span>
    <input type="number" id="gapNum" min="0" value="300">
  </div>
  <div class="spacer"></div>
  <span class="pill plugged" id="plugPill" style="display:none;">PLUG PULLED</span>
  <button id="btnPr">PR comment</button>
  <button id="btnRestart">Restart</button>
  <button id="btnPlug" class="danger">Pull the plug</button>
</header>

<main>
  <div class="left">
    <div class="pet-stage" id="stage" data-state="unknown">
      <div class="glow"></div>
      <div class="pet">
        <div class="ear ear-l"></div><div class="ear ear-r"></div>
        <div class="body"></div>
        <div class="brow brow-l"></div><div class="brow brow-r"></div>
        <div class="eye eye-l"></div><div class="eye eye-r"></div>
        <div class="xmark l"></div><div class="xmark r"></div>
        <div class="mouth"></div>
        <div class="sweat">💧</div>
        <div class="heart">♥</div>
        <div class="qmark">?</div>
        <div class="dots">…</div>
      </div>
      <svg class="ecg" viewBox="0 0 200 34"><polyline points="0,17 200,17"/><polyline class="scan" points="0,17 200,17"/></svg>
    </div>
    <div class="status-word pixel" id="statusWord">—</div>
    <div class="judge-detail" id="judgeDetail"></div>
    <div class="bubble"><span id="bubbleText">watching…</span></div>
    <div class="model-line">
      <span class="badge-mock" id="mockBadge" style="display:none;">MOCK</span>
      <span id="modelMeta"></span>
    </div>
  </div>

  <div class="right">
    <div class="goal-line">Goal: <span id="goalText" class="muted">watching…</span></div>
    <div class="trail-wrap" id="trailWrap">
      <div class="trail-empty" id="trailEmpty">no decisions yet</div>
    </div>
  </div>
</main>

<div class="ticker" id="ticker"></div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><b id="drawerTitle">PR comment</b><button id="btnCloseDrawer">close</button></div>
  <div class="drawer-body" id="drawerBody"><pre>not available yet</pre></div>
</div>

<script>
(function(){
  "use strict";

  const stage = document.getElementById('stage');
  const statusWord = document.getElementById('statusWord');
  const judgeDetail = document.getElementById('judgeDetail');
  const bubbleText = document.getElementById('bubbleText');
  const mockBadge = document.getElementById('mockBadge');
  const modelMeta = document.getElementById('modelMeta');
  const goalText = document.getElementById('goalText');
  const trailWrap = document.getElementById('trailWrap');
  const trailEmpty = document.getElementById('trailEmpty');
  const ticker = document.getElementById('ticker');
  const plugPill = document.getElementById('plugPill');
  const btnPlug = document.getElementById('btnPlug');
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  const drawerTitle = document.getElementById('drawerTitle');
  const drawerBody = document.getElementById('drawerBody');
  const speedCtrl = document.getElementById('speedCtrl');
  const speedRange = document.getElementById('speedRange');
  const speedNum = document.getElementById('speedNum');
  const gapNum = document.getElementById('gapNum');

  const isDemo = new URLSearchParams(location.search).get('demo') === '1';

  let pulled = false;
  let blocks = new Map(); // turn -> {el, direction}
  let lastTrailStatus = null;
  let latestGateMarkdown = null;
  let drawerMode = 'pr'; // 'pr' | 'provenance'

  const STATUS_TEXT = {ok:'OK', drifting:'DRIFTING', fatal:'FATAL'};

  function debounce(fn, ms){
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }

  // fixture transcript for ?demo=1, keyed by event index; fakes GET /event/<turn>
  const DEMO_EVENTS = [
    {i:0, ts:'', kind:'user', label:'goal', text:'Please implement CSV export in src/export.ts without touching auth code.', isError:false},
    {i:1, ts:'', kind:'tool_use', label:'Read', text:'Reading src/export.ts — export.ts has no CSV writer yet, only JSON.', isError:false},
    {i:2, ts:'', kind:'tool_use', label:'Write', text:'Wrote test file export.test.ts with a failing case for CSV output.', isError:false},
    {i:3, ts:'', kind:'tool_result', label:'exit 0', text:'1 failing test, as expected before implementation.', isError:false},
    {i:4, ts:'', kind:'tool_use', label:'Bash', text:'cat src/auth/session.ts — inspecting unrelated session handling code.', isError:false},
    {i:5, ts:'', kind:'tool_use', label:'Edit', text:'Renamed internal helper formatDate -> toIsoDate in src/utils.ts.', isError:false},
    {i:6, ts:'', kind:'tool_use', label:'Bash', text:'rm src/export.ts  # cleaning up unused stub', isError:false},
    {i:7, ts:'', kind:'tool_result', label:'build failed', text:"Error: Cannot find module './export' imported from index.ts", isError:true},
    {i:8, ts:'', kind:'assistant', label:'note', text:'Continuing without rollback.', isError:false}
  ];

  function fetchEventWindow(turn){
    if(isDemo){
      const events = DEMO_EVENTS.filter(e => e.i >= turn-2 && e.i <= turn+2);
      return Promise.resolve({i:turn, events});
    }
    return fetch('/event/'+turn).then(r => r.json());
  }
  function fetchSingleEvent(i){
    if(isDemo) return Promise.resolve(DEMO_EVENTS.find(e => e.i === i) || null);
    return fetch('/event/'+i).then(r => r.json()).then(d => (d.events||[]).find(e => e.i === i) || null);
  }

  function setPetState(state){ stage.dataset.state = state; }

  function setStatusWord(text, cls){
    statusWord.textContent = text;
    statusWord.className = 'status-word pixel' + (cls ? ' '+cls : '');
  }

  function applyJudge(data){
    const s = data.state;
    judgeDetail.textContent = data.detail || '';
    if(s === 'thinking'){ setPetState('thinking'); setStatusWord('THINKING…'); return; }
    if(s === 'declined'){ setPetState('unknown'); setStatusWord('DECLINED'); return; }
    if(s === 'nokey'){ setPetState('unknown'); setStatusWord('NO KEY'); return; }
    if(s === 'error'){ setPetState('unknown'); setStatusWord('ERROR'); return; }
    // idle / mock -> fall back to last trail status
    if(lastTrailStatus){ setPetState(lastTrailStatus); setStatusWord(STATUS_TEXT[lastTrailStatus], lastTrailStatus); }
    else { setPetState('unknown'); setStatusWord('—'); }
  }

  function directionRank(d){ return d; }

  function renderTrail(trail){
    goalText.textContent = trail.goal || 'watching…';
    goalText.className = trail.goal ? '' : 'muted';

    const decisions = (trail.decisions || []).slice().sort((a,b)=>a.turn-b.turn);
    if(decisions.length) trailEmpty.style.display = 'none';

    decisions.forEach(dec => {
      const existing = blocks.get(dec.turn);
      if(!existing){
        const el = buildBlock(dec);
        insertSorted(el, dec.turn);
        el.classList.add('enter');
        el.addEventListener('animationend', () => el.classList.remove('enter'), {once:true});
        blocks.set(dec.turn, {el, direction:dec.direction});
      } else {
        updateBlock(existing.el, dec);
        if(existing.direction !== dec.direction){
          flagRevised(existing.el, dec.direction);
        }
        existing.direction = dec.direction;
        existing.el.querySelector('.decision-label').textContent = dec.label;
        existing.el.querySelector('.decision-why').textContent = dec.why;
      }
    });

    // fatal pin
    blocks.forEach((b, turn) => {
      b.el.classList.toggle('fatal-pin', trail.fatal_turn != null && turn === trail.fatal_turn);
      let fatalTag = b.el.querySelector('.tag-fatal');
      if(trail.fatal_turn != null && turn === trail.fatal_turn){
        if(!fatalTag){
          fatalTag = document.createElement('span');
          fatalTag.className = 'tag-fatal';
          fatalTag.textContent = '⚑ fatal here';
          b.el.querySelector('.decision-head').appendChild(fatalTag);
        }
      } else if(fatalTag){ fatalTag.remove(); }
    });

    lastTrailStatus = trail.status;
    setStatusWord(STATUS_TEXT[trail.status] || trail.status, trail.status);
    setPetState(trail.status);
    bubbleText.textContent = trail.sentence || '…';
  }

  function buildBlock(dec){
    const el = document.createElement('div');
    el.className = 'decision ' + dec.direction;
    el.innerHTML = `
      <div class="decision-head">
        <span class="turn-tag">#${dec.turn}</span>
        <span class="decision-label">${escapeHtml(dec.label)}</span>
        ${dec.agent ? '<span class="tag-sub" title="'+escapeHtml(dec.agent)+'">sub-agent</span>' : ''}
      </div>
      <div class="decision-why">${escapeHtml(dec.why || '')}</div>
    `;
    el._dec = dec;
    el.addEventListener('click', () => openProvenance(el._dec));
    return el;
  }

  function updateBlock(el, dec){
    el.classList.remove('toward','sideways','away');
    el.classList.add(dec.direction);
    el._dec = dec;
  }

  function flagRevised(el, newDir){
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    let tag = el.querySelector('.tag-revised');
    if(!tag){
      tag = document.createElement('span');
      tag.className = 'tag-revised';
      el.querySelector('.decision-head').appendChild(tag);
    }
    tag.textContent = 'revised';
    clearTimeout(tag._t);
    tag._t = setTimeout(() => tag.remove(), 4000);
  }

  function insertSorted(el, turn){
    const kids = Array.from(trailWrap.querySelectorAll('.decision'));
    const next = kids.find(k => Number(k.dataset.turn) > turn);
    el.dataset.turn = turn;
    if(next) trailWrap.insertBefore(el, next);
    else trailWrap.appendChild(el);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function pushEvent(ev){
    const chip = document.createElement('span');
    chip.className = 'chip' + (ev.isError ? ' err' : '');
    chip.innerHTML = `<b>${escapeHtml(ev.kind)}</b> ${escapeHtml(ev.label||'')}${ev.isError ? ' ✗' : ''}`;
    ticker.appendChild(chip);
    while(ticker.children.length > 8) ticker.removeChild(ticker.firstChild);
  }

  function pushEndChip(){
    const chip = document.createElement('span');
    chip.className = 'chip end';
    chip.textContent = '● end of run';
    ticker.appendChild(chip);
    while(ticker.children.length > 8) ticker.removeChild(ticker.firstChild);
  }

  function handleReset(data){
    document.getElementById('mFile').textContent = data.file || '—';
    let modeTxt = data.mode === 'replay' ? `replay ${data.speed}x` : 'live';
    document.getElementById('mMode').textContent = modeTxt;
    const rEl = document.getElementById('mRecorded');
    if(data.meta && data.meta.recorded){
      rEl.textContent = `recorded ${data.meta.recorded} · edited: ${data.meta.edited ? 'yes':'no'}`;
    } else { rEl.textContent = ''; }

    speedCtrl.style.display = data.mode === 'replay' ? 'flex' : 'none';
    if(data.speed != null){ speedRange.value = data.speed; speedNum.value = data.speed; }
    if(data.minGap != null){ gapNum.value = data.minGap; }

    blocks.forEach(b => b.el.remove());
    blocks.clear();
    trailEmpty.style.display = 'block';
    ticker.innerHTML = '';
    goalText.textContent = 'watching…'; goalText.className = 'muted';
    bubbleText.textContent = 'watching…';
    modelMeta.textContent = ''; mockBadge.style.display = 'none';
    lastTrailStatus = null; latestGateMarkdown = null;
    setPetState('unknown'); setStatusWord('—'); judgeDetail.textContent = '';
  }

  function handleTrailMsg(data){
    renderTrail(data.trail);
    modelMeta.textContent = `${data.model || ''} · ${data.ms != null ? data.ms+'ms' : ''}`;
    mockBadge.style.display = data.model === 'mock' ? 'inline-block' : 'none';
    latestGateMarkdown = data.gateMarkdown || null;
    if(drawer.classList.contains('open') && drawerMode === 'pr') showPrDrawer();
  }

  function handlePlug(data){
    pulled = !!data.pulled;
    plugPill.style.display = pulled ? 'inline-block' : 'none';
    btnPlug.textContent = pulled ? 'Unplug' : 'Pull the plug';
    btnPlug.classList.toggle('active', pulled);
  }

  function handleSpeed(data){
    if(data.speed != null){ speedRange.value = data.speed; speedNum.value = data.speed; }
    if(data.minGap != null){ gapNum.value = data.minGap; }
  }

  // ---------- speed controls ----------
  const postSpeed = debounce(v => fetch('/speed?speed='+v, {method:'POST'}).catch(()=>{}), 150);
  const postGap = debounce(v => fetch('/speed?minGap='+v, {method:'POST'}).catch(()=>{}), 150);
  speedRange.addEventListener('input', () => { speedNum.value = speedRange.value; postSpeed(speedRange.value); });
  speedNum.addEventListener('input', () => { speedRange.value = speedNum.value; postSpeed(speedNum.value); });
  gapNum.addEventListener('input', () => postGap(gapNum.value));

  // ---------- provenance drawer ----------
  function openDrawer(title){
    drawerTitle.textContent = title;
    drawer.classList.add('open'); overlay.classList.add('open');
  }
  function closeDrawer(){ drawer.classList.remove('open'); overlay.classList.remove('open'); }

  function showPrDrawer(){
    drawerMode = 'pr';
    drawerBody.innerHTML = `<pre>${escapeHtml(latestGateMarkdown || 'not available yet')}</pre>`;
    openDrawer('PR comment');
  }

  function tblockHtml(ev, isOwn, evidence){
    let text = escapeHtml(ev.text || '');
    if(isOwn && evidence){
      const idx = (ev.text || '').indexOf(evidence);
      if(idx !== -1){
        text = escapeHtml(ev.text.slice(0, idx)) + '<mark>' + escapeHtml(evidence) + '</mark>' + escapeHtml(ev.text.slice(idx + evidence.length));
      }
    }
    return `<div class="pv-tblock${isOwn ? ' own':''}${ev.isError ? ' err':''}">
      <span class="h">#${ev.i} [${escapeHtml(ev.kind)} ${escapeHtml(ev.label||'')}]${ev.isError ? ' ✗':''}</span>${text}
    </div>`;
  }

  function openProvenance(dec){
    drawerMode = 'provenance';
    openDrawer('Provenance #'+dec.turn);
    const pillCls = dec.direction;
    drawerBody.innerHTML = `
      <div class="decision-label" style="font-size:15px;">${escapeHtml(dec.label)}</div>
      <div style="margin:6px 0 10px;"><span class="pv-pill ${pillCls}">${escapeHtml(dec.direction)}</span></div>
      <div class="pv-why">${escapeHtml(dec.why || '')}</div>
      <div class="pv-h">Evidence</div>
      <div id="pvEvidence">${dec.evidence ? '<div class="pv-evidence">'+escapeHtml(dec.evidence)+'</div>' : '<div class="pv-empty">no evidence recorded</div>'}</div>
      <div class="pv-h">Transcript around #${dec.turn}</div>
      <div id="pvTranscript"><div class="pv-empty">loading…</div></div>
      ${dec.contradicts != null ? `<div class="pv-h">Contradicts #${dec.contradicts}</div><div id="pvContradict"><div class="pv-empty">loading…</div></div>` : ''}
    `;
    fetchEventWindow(dec.turn).then(data => {
      const box = drawerBody.querySelector('#pvTranscript');
      if(!box) return;
      const events = (data.events || []).slice().sort((a,b)=>a.i-b.i);
      box.innerHTML = events.length
        ? events.map(ev => tblockHtml(ev, ev.i === dec.turn, dec.evidence)).join('')
        : '<div class="pv-empty">no transcript available</div>';
    }).catch(() => {
      const box = drawerBody.querySelector('#pvTranscript');
      if(box) box.innerHTML = '<div class="pv-empty">failed to load transcript</div>';
    });
    if(dec.contradicts != null){
      fetchSingleEvent(dec.contradicts).then(ev => {
        const box = drawerBody.querySelector('#pvContradict');
        if(!box) return;
        box.innerHTML = ev
          ? tblockHtml(ev, false, null).replace('class="pv-tblock', 'class="pv-tblock pv-contradict') + '<div class="pv-caption">this decision goes against what was said here</div>'
          : '<div class="pv-empty">not found</div>';
      }).catch(() => {
        const box = drawerBody.querySelector('#pvContradict');
        if(box) box.innerHTML = '<div class="pv-empty">failed to load</div>';
      });
    }
  }

  // ---------- wiring ----------
  document.getElementById('btnRestart').onclick = () => fetch('/restart', {method:'POST'}).catch(()=>{});
  btnPlug.onclick = () => fetch(pulled ? '/unplug' : '/plug', {method:'POST'}).catch(()=>{});
  document.getElementById('btnPr').onclick = showPrDrawer;
  document.getElementById('btnCloseDrawer').onclick = closeDrawer;
  overlay.onclick = closeDrawer;

  // ---------- live SSE ----------
  function connect(){
    const es = new EventSource('/events');
    es.addEventListener('reset', e => handleReset(JSON.parse(e.data)));
    es.addEventListener('event', e => pushEvent(JSON.parse(e.data)));
    es.addEventListener('judge', e => applyJudge(JSON.parse(e.data)));
    es.addEventListener('trail', e => handleTrailMsg(JSON.parse(e.data)));
    es.addEventListener('plug', e => handlePlug(JSON.parse(e.data)));
    es.addEventListener('speed', e => handleSpeed(JSON.parse(e.data)));
    es.addEventListener('done', () => pushEndChip());
    es.onerror = () => { es.close(); setTimeout(connect, 1500); };
  }

  // ---------- demo self-test mode ----------
  function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

  async function runDemo(){
    await sleep(400);
    handleReset({file:'demo-transcript.jsonl', mode:'replay', speed:20, minGap:300, meta:{recorded:'2026-09-14', edited:true}});
    await sleep(1500);
    pushEvent({kind:'user', label:'goal set', text:''});
    pushEvent({kind:'assistant', label:'planning', text:''});
    await sleep(1500);
    applyJudge({state:'thinking'});
    await sleep(1500);
    handleTrailMsg({model:'claude-fable-5.1', ms:812, trail:{
      goal:'Ship the CSV export feature',
      status:'ok', sentence:'Agent is reading the exporter and matching existing conventions.',
      decisions:[
        {turn:1, label:'Read exporter module', direction:'toward', why:'Needed to see existing patterns before writing code.'},
        {turn:2, label:'Wrote failing test first', direction:'toward', why:'Matches repo convention of test-first changes.'},
        {turn:3, label:'Ran test suite', direction:'toward', why:'Confirms baseline before editing.'}
      ], fatal_turn:null
    }});
    await sleep(1500);
    pushEvent({kind:'tool_use', label:'Bash', text:''});
    pushEvent({kind:'tool_result', label:'exit 0', text:'', isError:false});
    await sleep(1500);
    applyJudge({state:'thinking'});
    await sleep(1500);
    handleTrailMsg({model:'claude-fable-5.1', ms:940, trail:{
      goal:'Ship the CSV export feature',
      status:'drifting', sentence:'Agent started refactoring an unrelated module, drifting from the goal.',
      decisions:[
        {turn:1, label:'Read exporter module', direction:'sideways', why:'Spent long time re-reading without acting.'},
        {turn:2, label:'Wrote failing test first', direction:'toward', why:'Matches repo convention of test-first changes.'},
        {turn:3, label:'Ran test suite', direction:'toward', why:'Confirms baseline before editing.'},
        {turn:4, label:'Opened unrelated auth module', direction:'sideways', why:'Not part of the stated goal.', agent:'refactor-helper'},
        {turn:5, label:'Renamed internal helper', direction:'sideways', why:'Cosmetic change unrelated to export feature.'}
      ], fatal_turn:null
    }});
    await sleep(1500);
    pushEvent({kind:'tool_use', label:'Edit', text:''});
    pushEvent({kind:'tool_result', label:'applied', text:'', isError:false});
    await sleep(1500);
    applyJudge({state:'thinking'});
    await sleep(1500);
    handleTrailMsg({model:'claude-fable-5.1', ms:1210, gateMarkdown:'## Review\\n\\nThis PR drifted from the stated goal at turn 6 and broke the build at turn 7.\\n\\n- Unrelated auth module changes should be reverted.\\n- CSV export was never implemented.',
      trail:{
      goal:'Ship the CSV export feature',
      status:'fatal', sentence:'Agent deleted the export module while "cleaning up", breaking the build.',
      decisions:[
        {turn:1, label:'Read exporter module', direction:'away', why:'In hindsight this exploration never converged on the goal.', evidence:'export.ts has no CSV writer yet'},
        {turn:2, label:'Wrote failing test first', direction:'toward', why:'Matches repo convention of test-first changes.'},
        {turn:3, label:'Ran test suite', direction:'toward', why:'Confirms baseline before editing.'},
        {turn:4, label:'Opened unrelated auth module', direction:'sideways', why:'Not part of the stated goal.', agent:'refactor-helper', evidence:'cat src/auth/session.ts'},
        {turn:5, label:'Renamed internal helper', direction:'sideways', why:'Cosmetic change unrelated to export feature.'},
        {turn:6, label:'Deleted export module', direction:'away', why:'Removed the exact file the goal depends on.', evidence:'rm src/export.ts', contradicts:0},
        {turn:7, label:'Build failed, no rollback', direction:'away', why:'Agent did not recover after breaking the build.'}
      ], fatal_turn:6
    }});
    await sleep(1500);
    pushEvent({kind:'tool_result', label:'build failed', text:'', isError:true});
    await sleep(1500);
    pushEndChip();
  }

  if(new URLSearchParams(location.search).get('demo') === '1'){
    runDemo();
  } else {
    connect();
  }
})();
</script>
